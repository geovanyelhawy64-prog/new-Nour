name: Android release bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release label (for example 2.4.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  bundle:
    name: Build signed AAB
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$STORE_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          printf '%s\n' \
            "storePassword=$STORE_PASSWORD" \
            "keyPassword=$KEY_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            "storeFile=../release.keystore" > android/key.properties

      - name: Build obfuscated AAB
        run: |
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/symbols/${{ inputs.version }}

      - name: Upload signed bundle and symbols
        uses: actions/upload-artifact@v4
        with:
          name: noor-${{ inputs.version }}-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/symbols/${{ inputs.version }}/

      - name: Remove signing material
        if: always()
        run: |
          rm -f android/key.properties android/release.keystore
